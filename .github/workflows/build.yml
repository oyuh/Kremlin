name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Only the tag job writes anything, and it writes a release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Gradle toolchain asks for JDK 25; handing it one here beats having the
      # foojay resolver download a JDK on every run.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build

      # Every run, so a branch or PR build is downloadable without cutting a tag.
      - uses: actions/upload-artifact@v5
        with:
          name: Kremlin-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Tags only: the jar on the Releases page, notes written from the commits since
      # the last tag. gh is already on the runner, so this needs no third-party action.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --generate-notes --title "$GITHUB_REF_NAME"
