name: Kremlin
version: ${version}
main: me.lawsonhart.kremlin.Kremlin
api-version: '26.2'
author: Lawson Hart
description: Combat tagging and teleport rules, homes and warps, tpa, chat formatting, private messages, punishments, moderation and player utilities. Replaces EssentialsX and EssentialsChat.
folia-supported: true
# Fetched by the server at load and given its own classloader, so nothing is shaded into
# this jar and nothing here can collide with another plugin's copy.
libraries:
  - net.dv8tion:JDA:5.2.1

softdepend: [SimpleTeams, Vault, VaultUnlocked, PlaceholderAPI, LuckPerms]

commands:
  kremlin:
    description: Combat status, action bar style, reload, import homes.
    usage: /kremlin [bar|reload|importhomes]
    aliases: [combatprev, cprev]
  nickg:
    description: Open the gradient nickname builder.
    usage: /nickg
    permission: kremlin.nickg
  horsie:
    description: Spawn a maxed-out horse in the colourway of your choice.
    usage: /horsie <colour> [style]
  spawnmob:
    description: Spawn any mob, with any of the options that mob has.
    usage: /spawnmob <mob> [amount] [key:value ...]
    aliases: [mob, summonmob]
  dragondamage:
    description: Who has done the most damage to the ender dragon.
    usage: /dragondamage
    aliases: [dragon, dragondmg]
  clearchat:
    description: Wipe chat for everyone online.
    usage: /clearchat
    aliases: [cc, chatclear]
  slowchat:
    description: Set how long players must wait between messages.
    usage: /slowchat <seconds|off>
    aliases: [chatslow, slowmode]
  # Real commands with real executors and completers. They used to be caught in
  # PlayerCommandPreprocessEvent instead, purely so Essentials could not win the label; with
  # Essentials gone that workaround is too, and Bukkit dispatches these normally.
  #
  # No `permission:` here on purpose: each executor checks its own nodes so it can answer with
  # the configured message rather than Bukkit's stock one.
  home:
    description: Go to a home, or open the homes menu.
    usage: /home [name]
  sethome:
    description: Set a home here.
    usage: /sethome [name]
    aliases: [createhome]
  delhome:
    description: Delete a home.
    usage: /delhome <name>
    aliases: [remhome, removehome]
  renamehome:
    description: Rename a home.
    usage: /renamehome <old> <new>
    aliases: [homerename, movehome]
  homes:
    description: Open the homes menu.
    usage: /homes
    aliases: [listhomes]
  adminhome:
    description: Open another player's homes.
    usage: /adminhome <player>
    aliases: [homeadmin, homeof]
  comhub:
    description: Teleport to the community hub.
    usage: /comhub
    aliases: [communityhub]
  setcomhub:
    description: Set the community hub here.
    usage: /setcomhub
    aliases: [setcommunityhub]
  delcomhub:
    description: Clear the community hub.
    usage: /delcomhub
    aliases: [delcommunityhub]
  playerlist:
    description: Everyone who has ever played, with nicknames and teams.
    usage: /playerlist
    aliases: [players, plist]
  invsee:
    description: Open a player's inventory, online or off.
    usage: /invsee <player>
    aliases: [openinv, seeinv, einvsee]
  enderchest:
    description: Open your ender chest, or a player's, online or off.
    usage: /enderchest [player]
    aliases: [ec, echest, enderc, endersee, invseeender, eenderchest, eechest, eec, eenderc]
  # /hq, /sethq and /delhq are deliberately NOT declared here: SimpleTeams registers them
  # itself as shortcuts for /team home, and Kremlin only gates the teleport.
  link:
    description: Link your Discord account.
    usage: /link [code]
    aliases: [discordlink]
  unlink:
    description: Unlink your Discord account.
    usage: /unlink
    aliases: [discordunlink]
  resync:
    description: Fix your own Discord roles, or everyone's with "all".
    usage: /resync [all]
    aliases: [discordresync, syncroles]
  help:
    description: What you can do here.
    usage: /help
    aliases: [ehelp, commands]
  rules:
    description: The server rules.
    usage: /rules
    aliases: [erules]
  discord:
    description: The Discord invite.
    usage: /discord
  website:
    description: The website.
    usage: /website
  vote:
    description: Where to vote.
    usage: /vote
  store:
    description: The store.
    usage: /store
  links:
    description: Every link at once.
    usage: /links
  ban:
    description: Ban a player.
    usage: /ban <player> [reason]
    aliases: [eban]
  tempban:
    description: Ban a player for a while.
    usage: /tempban <player> <duration> [reason]
    aliases: [etempban]
  unban:
    description: Lift a ban.
    usage: /unban <player>
    aliases: [eunban, pardon]
  banip:
    description: Ban an address.
    usage: /banip <player|ip> [reason]
    aliases: [ebanip]
  unbanip:
    description: Lift an address ban.
    usage: /unbanip <ip>
    aliases: [eunbanip, pardonip]
  mute:
    description: Stop a player talking.
    usage: /mute <player> <duration> [reason]
    aliases: [emute]
  unmute:
    description: Let a player talk again.
    usage: /unmute <player>
    aliases: [eunmute]
  kick:
    description: Kick a player.
    usage: /kick <player> [reason]
    aliases: [ekick]
  kickall:
    description: Kick everyone.
    usage: /kickall [reason]
    aliases: [ekickall]
  warn:
    description: Warn a player, on the record.
    usage: /warn <player> <reason>
    aliases: [ewarn]
  punish:
    description: Open the punishment ladder for a player.
    usage: /punish <player>
    aliases: [epunish]
  alts:
    description: Accounts sharing an address with a player.
    usage: /alts <player>
    aliases: [ealts]
  history:
    description: A player's punishment record.
    usage: /history <player>
    aliases: [punishments, ehistory]
  options:
    description: Your own settings -- combat bar, messages, teleports, sounds.
    usage: /options
    aliases: [settings, kremlinoptions]
  warp:
    description: Travel to a warp.
    usage: /warp [name] [player]
    aliases: [ewarp]
  warps:
    description: List the warps.
    usage: /warps
    aliases: [ewarps, warplist]
  setwarp:
    description: Set a warp here.
    usage: /setwarp <name>
    aliases: [esetwarp, createwarp]
  delwarp:
    description: Delete a warp.
    usage: /delwarp <name>
    aliases: [edelwarp, remwarp, removewarp]
  tp:
    description: Teleport to a player, or a player to a player. An offline name goes to where they logged out.
    usage: /tp <player> [player]
    aliases: [etp, tele, tp2p]
  tphere:
    description: Bring a player to you.
    usage: /tphere <player>
    aliases: [etphere, s]
  tpo:
    description: Teleport, ignoring teleport toggles.
    usage: /tpo <player> [player]
    aliases: [etpo]
  tpohere:
    description: Bring a player to you, ignoring their toggle.
    usage: /tpohere <player>
    aliases: [etpohere]
  tpall:
    description: Bring everyone to you.
    usage: /tpall [player]
    aliases: [etpall]
  tpaall:
    description: Ask everyone to teleport to you.
    usage: /tpaall
    aliases: [etpaall]
  tppos:
    description: Teleport to coordinates.
    usage: /tppos <x> <y> <z> [yaw] [pitch] [world]
    aliases: [etppos]
  tptoggle:
    description: Turn teleport requests on or off.
    usage: /tptoggle [player] [on|off]
    aliases: [etptoggle]
  back:
    description: Go back where you were.
    usage: /back
    aliases: [eback, return]
  top:
    description: Teleport to the surface.
    usage: /top
    aliases: [etop]
  repair:
    description: Repair the item in your hand, or everything you carry.
    usage: /repair [hand|all]
    aliases: [erepair, fix]
  more:
    description: Fill the held stack.
    usage: /more
    aliases: [emore]
  give:
    description: Give a player an item.
    usage: /give <player> <item> [amount]
    aliases: [egive, i, item, eitem]
  skull:
    description: Get a player's head.
    usage: /skull [player]
    aliases: [eskull]
  itemname:
    description: Rename the item in your hand.
    usage: /itemname <name|clear>
    aliases: [iname, eitemname]
  itemlore:
    description: Edit the lore of the item in your hand.
    usage: /itemlore <add|set|remove|clear> [line] [text]
    aliases: [il, eitemlore]
  enchant:
    description: Enchant the item in your hand.
    usage: /enchant <enchantment> [level]
    aliases: [eenchant, enchantment]
  clearinventory:
    description: Empty an inventory.
    usage: /clearinventory [player|*] [item] [amount]
    aliases: [ci, clean, clearinvent, eclearinventory]
  trash:
    description: Open a window that throws away whatever is left in it.
    usage: /trash
    aliases: [disposal, edisposal]
  powertool:
    description: Bind a command to the item in your hand.
    usage: /powertool <command|clear>
    aliases: [pt, epowertool]
  powertooltoggle:
    description: Turn your powertools on or off.
    usage: /powertooltoggle
    aliases: [ptt, epowertooltoggle]
  nick:
    description: Set a nickname, yours or a player's.
    usage: /nick <nickname|off> [player]
    aliases: [enick, nickname]
  seen:
    description: When a player was last online.
    usage: /seen <player>
    aliases: [eseen]
  whois:
    description: Everything known about a player.
    usage: /whois <player>
    aliases: [ewhois]
  list:
    description: Who is online.
    usage: /list
    aliases: [who, online, elist]
  playtime:
    description: How long a player has been on the server.
    usage: /playtime [player]
    aliases: [eplaytime, played, ontime]
  heal:
    description: Restore health and hunger.
    usage: /heal [player]
    aliases: [eheal]
  feed:
    description: Restore hunger.
    usage: /feed [player]
    aliases: [efeed, eat]
  kill:
    description: Kill a player.
    usage: /kill [player]
    aliases: [ekill, suicide]
  fly:
    description: Toggle flight.
    usage: /fly [player]
    aliases: [efly]
  speed:
    description: Set walk or fly speed.
    usage: /speed [walk|fly] <0-10> [player]
    aliases: [espeed]
  sudo:
    description: Run a command as another player.
    usage: /sudo <player> <command>
    aliases: [esudo]
  weather:
    description: Change the weather.
    usage: /weather <sun|storm|thunder> [seconds]
    aliases: [eweather, sky]
  gamemode:
    description: Change game mode.
    usage: /gamemode <mode> [player]
    aliases: [gm, egamemode]
  gms:
    description: Survival mode.
    usage: /gms [player]
  gmc:
    description: Creative mode.
    usage: /gmc [player]
  gma:
    description: Adventure mode.
    usage: /gma [player]
  gmsp:
    description: Spectator mode.
    usage: /gmsp [player]
  msg:
    description: Send a private message.
    usage: /msg <player> <message>
    aliases: [m, tell, whisper, w, pm, t, emsg, etell, ewhisper]
  reply:
    description: Reply to the last person who messaged you.
    usage: /reply <message>
    aliases: [r, ereply]
  msgtoggle:
    description: Turn private messages on or off.
    usage: /msgtoggle [on|off]
    aliases: [messagetoggle, emsgtoggle]
  ignore:
    description: Stop seeing a player's chat and messages.
    usage: /ignore [player]
    aliases: [unignore, eignore]
  broadcast:
    description: Send a message to everyone online.
    usage: /broadcast <message>
    aliases: [bcast, ebroadcast]
  tpa:
    description: Ask to teleport to a player, or open the menu.
    usage: /tpa [player]
    aliases: [tpask, call]
  tpahere:
    description: Ask a player to teleport to you.
    usage: /tpahere [player]
    aliases: [tpaskhere]
  tpaccept:
    description: Accept a teleport request.
    usage: /tpaccept [player]
    aliases: [tpyes]
  tpdeny:
    description: Deny a teleport request.
    usage: /tpdeny [player]
    aliases: [tpno]
  tpacancel:
    description: Cancel a teleport request you sent.
    usage: /tpacancel [player]
    aliases: [tpcancel]

# Every combatprev.* node below is still honoured in code alongside its kremlin.* twin, so a
# LuckPerms setup from before the merge keeps working untouched. So do the Essentials nodes.
permissions:
  kremlin.nickg:
    description: Allows use of /nickg.
    default: true
  kremlin.reload:
    description: Reload the config. combatprev.reload also works.
    default: op
  kremlin.home:
    description: Use /home. combatprev.home and essentials.home also work.
    default: true
  kremlin.sethome:
    description: Use /sethome. combatprev.sethome and essentials.sethome also work.
    default: true
  kremlin.delhome:
