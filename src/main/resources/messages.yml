# /help, /rules, /discord and friends. Each is a list of MiniMessage lines, sent as typed.
# Point several at the same text if they should all say the same thing.
info:
  help:
    - "<dark_gray><strikethrough>                                        "
    - "<gold><bold>Commands"
    - "<gray>Homes <dark_gray>- <white>/home /sethome /homes"
    - "<gray>Teleport <dark_gray>- <white>/tpa /tpahere /tpaccept /warp"
    - "<gray>Chat <dark_gray>- <white>/msg /reply /ignore"
    - "<gray>Settings <dark_gray>- <white>/options /nick"
    - "<dark_gray>Type a command with no arguments to see how it works."
    - "<dark_gray><strikethrough>                                        "
  rules:
    - "<dark_gray><strikethrough>                                        "
    - "<gold><bold>Rules"
    - "<gray>1. <white>Don't grief or steal."
    - "<gray>2. <white>No cheating or exploiting."
    - "<gray>3. <white>Keep chat civil."
    - "<dark_gray><strikethrough>                                        "
  discord:
    - "<blue>Discord: <white><underlined>https://discord.gg/change-me"
  website:
    - "<blue>Website: <white><underlined>https://example.com"
  vote:
    - "<blue>Vote: <white><underlined>https://example.com/vote"
  store:
    - "<blue>Store: <white><underlined>https://example.com/store"
  links:
    - "<blue>Discord: <white><underlined>https://discord.gg/change-me"
    - "<blue>Website: <white><underlined>https://example.com"
