fly-off-other: "<yellow>Flight disabled for <yellow><player><yellow>."
speed-usage: "<red>Usage: /speed [walk|fly] <0-10> [player]"
speed-set: "<green>Set <mode> speed to <white><speed><green> for <yellow><player><green>."
gamemode-usage: "<red>Usage: /gamemode <survival|creative|adventure|spectator> [player]"
gamemode-unknown: "<red><yellow><mode><red> isn't a game mode."
