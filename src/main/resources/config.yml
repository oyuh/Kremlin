# Kremlin
#
# Carried over from CombatPrev. An existing plugins/CombatPrev/config.yml is copied into
# plugins/Kremlin on first start, so your own settings come with you; this file is layered
# underneath it as defaults, so keys added later still read back.

# How long a player stays combat-tagged after taking/dealing player damage.
combat-seconds: 15

# Fleeing a fight makes teleporting SLOWER, not impossible.
#
# If a player was in combat and has since moved stand-still-flee-distance blocks from where
# they were last hit, this many seconds is ADDED to their teleport warmup. A 3s warmup becomes
# 10s. They are never refused for moving -- they just wait longer, and moving during the
# warmup cancels it. Someone who wasn't in a fight, or who hasn't run anywhere, is unaffected.
stand-still-seconds: 7

# How far from the last hit counts as running away. Changing world always counts.
stand-still-flee-distance: 100

# How long after the last hit the penalty can still apply.
stand-still-window-seconds: 60

# Warmup between someone accepting a /tpa and the teleport actually happening. BOTH players
# are told, and either one moving cancels it. 0 disables.
#
# This is the BASE warmup for every teleport we run (/home, /hq, an accepted /tpa). The flee
# penalty above is added on top when it applies. Combat tags still block a teleport outright.
tpa-warmup-seconds: 3

tpa:
  # How long a request stays open before it expires.
  request-seconds: 120
  # After a tpa moves you, how long before you can send another request. 0 disables.
  cooldown-seconds: 30

# Combat-log punishment: kill the player and dump their whole inventory on the ground.
kill-on-combat-log: true

# Strip the invulnerability / no-damage ticks a teleport hands out, so nobody can
# /spawn into a safety bubble. NOTE: vanilla world-spawn block protection is a
# server.properties setting -- set `spawn-protection=0` there, a plugin can't touch it.
clear-invulnerability-after-teleport: true

# Teleport causes to block while locked. Ender pearls are deliberately allowed
# (they're a combat mechanic). Valid values: PlayerTeleportEvent.TeleportCause names.
blocked-teleport-causes:
  - COMMAND
  - PLUGIN
  - SPECTATE
  - CONSUMABLE_EFFECT   # chorus fruit. Was CHORUS_FRUIT before MC 26.2 -- rename it in an old config.
  - END_GATEWAY
  - END_PORTAL
  - NETHER_PORTAL

# Commands blocked while locked. Namespaces (essentials:home) are stripped before
# matching, so listing the bare name covers /essentials:home too. An entry may name a
# subcommand as well, e.g. "team sethome".
#
# Moving or clearing a team HQ is always blocked while tagged whether or not it is listed
# here -- summoning your team to the fight is the escape this whole plugin exists to stop.
blocked-commands:
  - tp
  - tpa
  - tpahere
  - tpaccept
  - tpyes
  - tpdeny
  - tpno
  - tpo
  - tphere
  - tpohere
  - tpall
  - tppos
  - tpaall
  - tptoggle
  - home
  - homes
  - sethome
  - spawn
  - warp
  - warps
  - back
  - rtp
  - wild
  - wilderness
  - ec
  - echest
  - enderchest   # your own only -- /enderchest <player> is a staff command and isn't blocked
  - kit
  - heal
  - feed
  - god
  - fly
  - vanish
  - v
  - suicide
  - kill
  - logout
  - afk
  - top
  - workbench
  - wb
  - craft
  - anvil
  - disposal
  - trash

homes:
  # Named homes per player, on top of the always-available bed home and team HQ.
  # Beaten by kremlin.homes.<n>, the old combatprev.homes.<n>, or essentials.sethome.multiple.<n>.
  max-per-player: 3

# NOTE: subclaims belong to SimpleTeams entirely -- its config owns subclaims.max-per-player,
# subclaims.sign-name-length and subclaims.override-rank, the signs and protection are its
# listeners, and claims.yml is its file. Manage them with /team claims and /team unclaim.

# Messages live in messages.yml.

############################################################
# Chat
############################################################

# Chat formatting, replacing EssentialsChat. The keys and placeholders are EssentialsChat's, so
# an existing config carries over as written -- on first start the chat settings are copied out
# of plugins/Essentials/config.yml automatically and `chat.imported` below is set to stop it
# happening twice. Delete that flag to import again.
#
# Placeholders: {MESSAGE} {USERNAME} {DISPLAYNAME} {NICKNAME} {PREFIX} {SUFFIX} {GROUP}
#               {WORLD} {WORLDNAME} {SHORTWORLDNAME} {TEAMNAME} {TEAMPREFIX} {TEAMSUFFIX}
#
# Anything else in {braces} is handed to PlaceholderAPI as %that%, which is how EssentialsChat
# resolved third-party placeholders -- {simpleteams_prefix_formatted} keeps working.
#
# Both &-codes and MiniMessage tags work. The player's own message is inserted as text, never as
# markup, so nobody can type formatting into a format they were not given permission for.
chat:
  # false leaves chat exactly as the server rendered it.
  enabled: true

  # Empty means "don't touch chat". {PREFIX} and {SUFFIX} come from Vault.
  format: ''

  # Per-group overrides, beating `format`. The group is the Vault primary group, matched
  # case-insensitively. If your permissions plugin sets a group display name, use that.
  group-formats: {}

  # Set to true once the EssentialsX import has run.
  imported: false

# Join and quit messages, in EssentialsX's keys and placeholders.
# "none" keeps the vanilla message; "" hides it entirely.
# Placeholders: {PLAYER} {DISPLAYNAME} {USERNAME} {PREFIX} {SUFFIX} {ONLINE} {UNIQUE}
custom-join-message: "none"
custom-quit-message: "none"

newbies:
  # Shown instead of the join message the first time somebody ever joins. "" disables it.
  announce-format: ''

############################################################
# Nicknames, and the short player commands
############################################################

# Nicknames are stored as MiniMessage in users.yml. On first start these settings, and every
# existing nickname, are read out of plugins/Essentials once.
nick:
  # Prefixed to every nickname so it reads as one. EssentialsX's nickname-prefix.
  prefix: ''
  # Nickname length limit.
  max-length: 32
  # A nickname must match this to be accepted. kremlin.nick.allowunsafe skips the check.
  allowed-regex: '^[a-zA-Z_0-9§&<>:#-]+$'
  # Measure the length without the colour codes.
  ignore-colours-in-length: true
  # Set to true once the EssentialsX settings and nicknames have been imported.
  imported: false
  imported-names: false

# /heal also clears potion effects.
remove-effects-on-heal: true

# /speed takes 0-10; these cap what that actually maps to. kremlin.speed.bypass ignores them.
max-walk-speed: 0.8
max-fly-speed: 0.8

############################################################
# Items
############################################################

# Allow /repair on enchanted gear. false makes it kremlin.repair.enchanted only.
repair-enchanted: true

# Allow enchantment levels past the enchantment's own maximum, for anyone holding
# kremlin.enchantments.allowunsafe. false caps everyone at the safe maximum.
unsafe-enchantments: true

# How many items /give hands over when no amount is typed. Below 1 means a full stack.
default-stack-size: -1

# The stack size kremlin.oversizedstacks unlocks for /give and /more.
oversized-stacksize: 128

# How many lore lines /itemlore add will stack up. kremlin.itemlore.bypass ignores it.
max-itemlore-lines: 10

############################################################
# Warps
############################################################

# Require kremlin.warp.<name> for each warp on top of kremlin.warp. EssentialsX's setting of the
# same name. Existing warps are read out of plugins/Essentials/warps on first start.
per-warp-permission: false

warps:
  # Set to true once the EssentialsX warps have been imported.
  imported: false

############################################################
# Punishments
############################################################

# Bans go on the server's own ban list, which already does expiry, reasons and the disconnect
# screen. Mutes and the audit trail live in punishments.yml.

# Longest a /mute or /tempban may be, in seconds. -1 for no limit. EssentialsX's settings, and
# kremlin.mute.unlimited / kremlin.tempban.unlimited skip them.
max-mute-time: -1
max-tempban-time: -1

# Commands a muted player may not run. Kremlin's own message commands are covered separately;
# this is for anything else on the server that reaches other players.
mute-commands:
  - msg
  - m
  - tell
  - whisper
  - w
  - pm
  - t
  - reply
  - r
  - me
  - f

punish:
  # Used when a ban is issued with no reason typed.
  default-reason: "Banned"

  # The /punish menu. Each rung is a console command with {player} filled in, so a rung can run
  # anything -- including another plugin's command -- without changing any code.
  ladder:
    - name: "Warn"
      material: PAPER
      command: "warn {player} Please read the rules"
    - name: "Mute 1h"
      material: BOOK
      command: "mute {player} 1h Spam"
    - name: "Kick"
      material: IRON_DOOR
      command: "kick {player} Please read the rules"
    - name: "Tempban 1d"
      material: IRON_BARS
      command: "tempban {player} 1d Breaking the rules"
    - name: "Ban"
      material: BARRIER
      command: "ban {player} Breaking the rules"

############################################################
# Discord
############################################################

# The bot runs inside this plugin -- there is no second process to deploy. JDA is fetched by
# the server's own library loader (the `libraries:` block in plugin.yml), so the jar stays small.
#
# The bot needs the SERVER MEMBERS INTENT enabled on its application page, or it cannot read or
# assign roles for anyone who is not currently speaking.
discord:
  enabled: false

  # KEEP THIS OUT OF VERSION CONTROL. Anyone holding it controls the bot.
  token: ''

  # The Discord server id. Slash commands are registered against this one guild so they appear
  # immediately rather than taking up to an hour, as global commands do.
  guild: ''

  # Role id allowed to use the moderation slash commands. Blank means nobody can.
  staff-role: ''

  # Channel id for the audit trail: every punishment, link and unlink. Blank turns it off.
  # The bot needs Send Messages and Embed Links there.
  log-channel: ''

  link:
    # How long a link code is good for.
    code-seconds: 300
    # Code length. Characters that look alike (O/0, I/1, S/5) are never used.
    code-length: 6

  roles:
    # Given to anyone linked at all. Blank to skip.
    verified: ''
    # Permissions group -> role id, read through Vault.
    ranks: {}
    teams:
      enabled: true
      # Team name -> role id. Set these in game with:
      #   /team admin discord <team> <roleid>
      #   /team admin discord <team> clear
      #   /team admin discord list
      # Nothing is created and nothing is matched by name -- only roles listed here are touched.
      map: {}

  # How often roles are reconciled. SimpleTeams has no join/leave event to listen for, so team
  # roles are polled rather than pushed.
  resync-minutes: 30

# The MOTD in the multiplayer server list. Off until you turn it on -- server.properties
# keeps the MOTD while this is false.
#
# Every line is MiniMessage: <gradient:#a:#b>, <#ff0000>, <bold>, the lot. <online> and <max>
# are the current and maximum player counts. Prefix a line with <center> to have it padded to
# the middle of the list entry.
#
# The client shows TWO lines and clips each at roughly 45 characters.
motd:
  enabled: false
  lines:
    - "<center><gradient:#ff4d4d:#ffb84d><bold>Kremlin</bold></gradient>"
    - "<center><gray><online>/<max> online</gray>"
  # Pixel width of the list entry's text area, used by <center>. Nudge it if centring
  # looks a touch off in your client.
  center-width: 270
